[project]
name = "linux-training"
version = "0.1.0"
description = "Lab pédagogique Linux RHCSA + LFCS — fournisseur de labs pour la CLI dsoxlab"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
# Le contrat dsoxlab impose que chaque lab nomme son test
# challenge/tests/test_functional.py. Les 84 fichiers partagent donc le même
# basename, dans des répertoires sans __init__.py : le mode d'import
# « prepend » historique les prend alors pour un seul et même module et échoue
# en « import file mismatch ». importlib les isole par leur chemin.
#
# Sans ce réglage, `pytest` à la racine sortait en « Interrupted: 83 errors
# during collection » et ne collectait plus que le premier lab (dsoxlab, lui,
# lance un lab à la fois et ne voit pas le problème).
addopts = "--import-mode=importlib"

# `ansible-runner` appelle encore `codecs.open()`, que Python 3.14 déprécie :
# chaque playbook joué émet une poignée de DeprecationWarning, ce qui donne des
# lignes « 232 warnings » sur les labs vm. Ce n'est ni notre code ni notre
# décision, et ce bruit avait un coût réel : il masquait un ResourceWarning
# venant de dsoxlab lui-même (un descripteur d'artefact jamais refermé).
#
# On fait donc taire ce message précis, de cette bibliothèque précise. Tout
# AUTRE warning reste visible, ce qui est bien l'intérêt de l'opération : un
# warning qui parle de notre code ne doit pas se noyer dans celui d'une
# dépendance. À retirer quand ansible-runner aura migré vers open().
# Le message est traité comme une EXPRESSION RÉGULIÈRE : les parenthèses de
# `codecs.open()` doivent être échappées, sinon elles forment un groupe vide et
# le motif ne correspond plus à rien (constaté : le filtre restait sans effet).
# Guillemets SIMPLES : en TOML, une chaîne littérale n'interprète pas les
# échappements, ce qu'il faut pour écrire une regex. Entre guillemets doubles,
# `\.` et `\(` sont des séquences d'échappement invalides et le fichier ne
# parse plus.
filterwarnings = [
    "default",
    'ignore:codecs\.open\(\) is deprecated:DeprecationWarning',
]

# Ne collecter QUE les tests des challenges. Le contrat dsoxlab impose leur
# emplacement (challenge/tests/test_functional.py) : tout ce qui porte
# `test_*.py` ailleurs est autre chose.
#
# Deux conséquences voulues :
#
# 1. `tests/` (les vérificateurs de CATALOGUE : doc_url, liens internes,
#    solutions chiffrées, cohérence de l'outillage) reste hors de la suite
#    normale. Ils ne valident pas un lab, ils valident le dépôt, et l'un
#    d'eux fait 72 requêtes réseau. On les lance explicitement :
#      pytest tests/ -v                    (les trois locaux, instantanés)
#      pytest tests/test_doc_urls.py -v    (celui qui a besoin du réseau)
#    Un chemin passé en argument prime sur testpaths : ces commandes
#    fonctionnent malgré cette exclusion.
# 2. `solution/` ne contient QUE des corrections de formateur, chiffrées par
#    ansible-vault. Un fichier de référence à y poser chez l'apprenant est un
#    ARTEFACT, pas un test à jouer : pytest sortirait sur le chiffré.
testpaths = ["labs"]
norecursedirs = [
    "solution", "deps", "*.egg", ".git", ".venv",
]

[tool.uv]
# Ce dépôt n'est pas un package Python — juste un fournisseur de labs.
# uv crée quand même un venv pour les dev-deps (pytest, dsoxlab editable)
# mais ne tente pas de builder le projet.
package = false

# Ce dépôt fournit des labs (meta.yml + lab.yaml + setup/cleanup.yaml)
# consommés par la CLI dsoxlab. La CLI est installée séparément en
# outil global :
#   uv tool install dsoxlab
# ou
#   pipx install dsoxlab

[dependency-groups]
# dsoxlab n'est PAS déclaré ici, et c'est délibéré : ici la CLI est un OUTIL,
# installé à part, comme dans le catalogue Kubernetes jumeau.
#
#     uv tool install dsoxlab      # ou : uvx dsoxlab <commande>
#
# Elle y était jusqu'au 2026-09-15, en source chemin local éditable
# (`../dsoxlab`), et cela coûtait trois choses, chacune mesurée :
#
#   - le verrou n'était pas PORTABLE : il décrivait une dépendance qui n'existe
#     que sur un poste ayant le dépôt dsoxlab à côté ;
#   - il n'était pas VÉRIFIABLE en CI, où `../dsoxlab` est absent, donc rien ne
#     garantissait qu'il décrivait encore le pyproject ;
#   - il n'était pas SUIVABLE par Dependabot, pour la même raison. Le dépôt
#     avait donc un uv.lock de 100 Ko que personne ne faisait avancer, et c'est
#     ainsi que deux vulnérabilités (pytest, click) y ont dormi jusqu'à ce
#     qu'un scan les trouve.
#
# Aucun hook ni aucun job n'en dépendait : tous passent par `uvx dsoxlab` ou
# `uv run --no-project`, vérifié avant de le retirer. Ce qui reste est ce dont
# les vérificateurs de catalogue ont besoin pour lire des YAML.
dev = [
    "pyyaml>=6",
]
