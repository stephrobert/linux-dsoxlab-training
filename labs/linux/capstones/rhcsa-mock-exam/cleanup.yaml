---
# Capstone RHCSA — retire les givens du setup et les artefacts principaux des
# taches, en best-effort (failed_when: false). Un reset COMPLET des 20 taches se
# fait au mieux en reprovisionnant des VM fraiches :
#   dsoxlab destroy && dsoxlab provision

# ── Serveur : alma-rhcsa-1 ────────────────────────────────────────────────────
- name: RHCSA mock exam — server cleanup
  hosts: alma-rhcsa-1.lab
  become: true
  gather_facts: false
  tasks:
    - name: Defaire les artefacts serveur (best-effort)
      ansible.builtin.shell: |
        set +e
        swapoff /swapfile 2>/dev/null; rm -f /swapfile
        umount /data/share 2>/dev/null; umount /data 2>/dev/null
        exportfs -ua 2>/dev/null
        rm -f /var/log/myapp.log /var/www/html/index.html
        rm -f /usr/local/bin/myapp.sh /usr/local/bin/weekly-backup.sh
        systemctl disable --now myapp.service weekly-backup.timer 2>/dev/null
        rm -f /etc/systemd/system/myapp.service \
              /etc/systemd/system/weekly-backup.service \
              /etc/systemd/system/weekly-backup.timer
        systemctl daemon-reload 2>/dev/null
        # Rendre le disque partage : les taches 1 a 3 posent une table GPT, un
        # VG et un LV dessus. Les laisser en place occupe /dev/vdb pour tous les
        # labs suivants, qui echouent alors a la place de celui-ci.
        #
        # Le umount du debut de ce bloc ne suffit pas : l export NFS tient
        # encore /data/share a ce moment-la (exportfs -ua vient apres), donc le
        # demontage echoue et le VG reste actif. On redemonte ici, apres la
        # desexportation, avec un demontage paresseux en dernier recours.
        exportfs -ua 2>/dev/null
        umount -R /data/share 2>/dev/null
        umount -R /data 2>/dev/null || umount -l /data 2>/dev/null
        # Les taches 6 et 7 creent appuser, devuser et le groupe developers.
        # Les laisser en place occupe des UID/GID que d autres labs posent a
        # leur tour, et fait echouer leur useradd a la place de celui-ci.
        userdel -r appuser 2>/dev/null
        userdel -r devuser 2>/dev/null
        groupdel developers 2>/dev/null
        vgchange -an vgapp 2>/dev/null
        vgremove -f vgapp 2>/dev/null
        pvremove -f -y /dev/vdb1 2>/dev/null
        wipefs -a /dev/vdb1 /dev/vdb2 /dev/vdb 2>/dev/null
        partprobe /dev/vdb 2>/dev/null
        exit 0
      changed_when: false

    - name: Retirer les entrees fstab swap/data
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "{{ item }}"
        state: absent
      loop:
        - '^/swapfile\s'
        - '\s/data\s'
      failed_when: false

# ── Client : alma-rhcsa-2 ─────────────────────────────────────────────────────
- name: RHCSA mock exam — client cleanup
  hosts: alma-rhcsa-2.lab
  become: true
  gather_facts: false
  tasks:
    - name: Defaire les artefacts client (best-effort)
      ansible.builtin.shell: |
        set +e
        umount /mnt/share 2>/dev/null
        rm -f /root/.exam-root-randomized
      changed_when: false

    - name: Retirer l'entree fstab NFS
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '\s/mnt/share\s'
        state: absent
      failed_when: false
