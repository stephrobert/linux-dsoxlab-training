id: capstone-serveur-casse
title: "Serveur cassé : le site ne répond plus, le symptôme ne dit rien"
description: "Un site interne qui marchait cesse de répondre. Le setup injecte UNE panne parmi six, tirée au sort, et ne dit jamais laquelle : service arrêté, mauvais port, pare-feu fermé, contexte SELinux, permissions du docroot, système de fichiers plein. Vous diagnostiquez, vous réparez, et la réparation doit survivre à un redémarrage. La notation porte uniquement sur l'état observable, avec trois contrôles qui refusent les réparations à la masse : SELinux doit rester enforcing, firewalld doit rester actif, et le docroot ne doit pas devenir accessible en écriture à tous."
section: capstones
lab_type: capstone
level: l3
track:
  - capstones
  - depanner
skills:
  - service-troubleshooting
  - systemd
  - journalctl
  - selinux
  - firewalld
  - permissions
  - diskspace-troubleshooting
  - nginx
difficulty: advanced
estimated_time: 45m

# DEUX machines, et ce n'est pas un confort : une panne de pare-feu ou de
# contexte SELinux ne se voit pas depuis la machine elle-meme. Un `curl
# localhost` peut repondre 200 alors que le service reste injoignable du
# reseau. Le verdict se prend donc DEPUIS LE CLIENT, comme un utilisateur.
runtime:
  type: vm
  session: local
  default: serveur
  snapshot_required: false
  targets:
    - name: serveur
      host: alma-rhcsa-1.lab
      label_en: "AlmaLinux 10 — the broken server"
      label_fr: "AlmaLinux 10 — le serveur en panne"
    - name: client
      host: alma-rhcsa-2.lab
      label_en: "AlmaLinux 10 — the client that must get a 200"
      label_fr: "AlmaLinux 10 — le client qui doit obtenir un 200"

distros:
  - almalinux10
  - rhel10
doc_url: https://blog.stephane-robert.info/docs/admin-serveurs/linux/depanner/
validation:
  functional: true
  security: true
  persistence_after_reboot: true
certification_tags:
  - rhcsa

# Capstone = mode examen, aucun indice. Le seuil est haut parce que la moitie
# des tests sont des garde-fous : les desactiver reviendrait a « reparer » en
# cassant la securite, ce que ce capstone existe precisement pour interdire.
exam_passing_score: 80
