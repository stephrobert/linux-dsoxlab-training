---
# Capstone LFCS — état initial du candidat.
#
# Le setup fournit UNIQUEMENT les prérequis (fichiers à traiter, scripts à
# lancer, groupe/utilisateur existants) et remet à zéro tout ce que les tâches
# doivent produire — sinon un lab joué avant fausserait la note.
#
# Il ne fait AUCUNE des 17 tâches : c'est le travail du candidat.
- name: LFCS mock exam — givens
  hosts: lab_target
  become: true
  gather_facts: false
  tasks:
    # ------------------------------------------------------------------
    # Outillage sur lequel s'appuient les tâches (pas les tâches elles-mêmes)
    # ------------------------------------------------------------------
    - name: Base tooling the tasks rely on
      ansible.builtin.package:
        name:
          - xfsprogs
          - quota
          - lvm2
          - ufw
          - cron
          - git
          - openssl
          - lsof
          - acl
          - autofs
        state: present

    # ------------------------------------------------------------------
    # Section A — matière à traiter
    # ------------------------------------------------------------------
    # Le domaine « Essential Commands » du LFCS ne designe plus les commandes
    # de base du shell. Ses six objectifs publies sont Git, la creation et le
    # depannage de services, la supervision des performances, les contraintes
    # applicatives, l'espace disque et les certificats SSL. Les donnees
    # ci-dessous servent ce perimetre-la.

    - name: Task 1 — the working tree the candidate must put under Git
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /srv/deploiement
        - /srv/deploiement/.cache

    - name: Task 1 — two files to track, one directory to ignore
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - path: /srv/deploiement/config.yml
          content: "port: 8080\n"
        - path: /srv/deploiement/notes.txt
          content: "premiere version du deploiement\n"
        - path: /srv/deploiement/.cache/build.bin
          content: "artefact de build, ne doit pas etre versionne\n"

    # Task 2 — un service EN PANNE, avec deux defauts a trouver :
    # le chemin de l'ExecStart ne pointe nulle part, et le script n'est pas
    # executable. C'est l'objectif « Create, configure, and troubleshoot
    # services » : le candidat repare, il n'ecrit pas de zero.
    - name: Task 2 — the collector script, deliberately not executable
      ansible.builtin.copy:
        dest: /usr/local/bin/collecteur.sh
        mode: "0644"
        content: |
          #!/bin/bash
          while true; do
              echo "$(date -Is) collecte" >> /var/log/collecteur.log
              sleep 5
          done

    - name: Task 2 — the broken unit, with a path that leads nowhere
      ansible.builtin.copy:
        dest: /etc/systemd/system/collecteur.service
        mode: "0644"
        content: |
          [Unit]
          Description=Collecteur de metriques du lab

          [Service]
          Type=simple
          ExecStart=/usr/local/sbin/collecteur.sh
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    # Task 3 — un fichier supprime mais toujours ouvert : df voit l'espace
    # occupe, du ne le trouve pas. C'est l'objectif « Troubleshoot diskspace
    # issues », et le piege qui coute le plus de temps en production.
    - name: Task 3 — the unit that holds a deleted file open
      ansible.builtin.copy:
        dest: /etc/systemd/system/fuite-disque.service
        mode: "0644"
        content: |
          [Unit]
          Description=Retention d'un fichier supprime (epreuve du lab)

          [Service]
          Type=simple
          ExecStart=/bin/bash -c 'dd if=/dev/zero of=/var/tmp/fuite bs=1M count=512 status=none; exec 3<>/var/tmp/fuite; rm -f /var/tmp/fuite; exec sleep infinity'

          [Install]
          WantedBy=multi-user.target

    - name: Task 3 — start the leak so df and du disagree
      ansible.builtin.systemd_service:
        name: fuite-disque.service
        daemon_reload: true
        enabled: true
        state: restarted

    - name: Task 4 — the directory the certificate will live in
      ansible.builtin.file:
        path: /etc/ssl/lab
        state: directory
        mode: "0755"

    # Task 10 — un repertoire volontairement ferme : root:root, 0750. La seule
    # facon d'y ouvrir un acces a devops sans toucher au mode standard est une
    # ACL POSIX, ce que demande l'objectif « Configure and manage ACLs ».
    - name: Task 10 — the closed directory ACLs will have to open
      ansible.builtin.file:
        path: /srv/rapports
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Task 10 — a file already inside, to show the ACL is not retroactive
      ansible.builtin.copy:
        dest: /srv/rapports/bilan.csv
        owner: root
        group: root
        mode: "0640"
        content: |
          date,service,etat
          2026-09-15,collecteur,ok

    # Task 16 — autofs gere le point de montage lui-meme, mais son repertoire
    # parent doit exister avant qu'il demarre.
    - name: Task 16 — the parent directory the automounter will manage
      ansible.builtin.file:
        path: /mnt/auto
        state: directory
        mode: "0755"

    # ------------------------------------------------------------------
    # Sections B/C — prérequis (scripts, groupe, utilisateur)
    # ------------------------------------------------------------------
    - name: Tasks 6/7/8 — provide the scripts the units must run
      ansible.builtin.copy:
        dest: "{{ item }}"
        mode: "0755"
        content: |
          #!/bin/bash
          # Script fourni par le sujet — ne pas modifier.
          sleep infinity
      loop:
        - /usr/local/bin/labwatch.sh

    - name: Task 7/8 — provide the report script (short-lived)
      ansible.builtin.copy:
        dest: /usr/local/bin/labreport.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Script fourni par le sujet — ne pas modifier.
          echo "report $(date -Is)" >> /var/log/labreport.log

    - name: Tasks 4/9/10 — the auditors group exists, the accounts do not
      ansible.builtin.group:
        name: auditors
        state: present

    - name: Tasks 8/16 — the devops user exists (quota + cron target)
      ansible.builtin.user:
        name: devops
        create_home: true
        shell: /bin/bash

    # ------------------------------------------------------------------
    # Remise à zéro : tout ce que les 17 tâches doivent produire
    # ------------------------------------------------------------------
    - name: Clean slate — Sections A/B/C artefacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /srv/deploiement/.git
        - /srv/deploiement/.gitignore
        - /var/log/collecteur.log
        - /root/diskspace.txt
        - /etc/ssl/lab/collecteur.key
        - /etc/ssl/lab/collecteur.crt
        - /srv/shared
        - /etc/systemd/system/labwatch.service
        - /etc/systemd/system/labreport.service
        - /etc/systemd/system/labreport.timer
        - /etc/sudoers.d/auditors
        - /etc/netplan/99-lab.yaml

    - name: Clean slate — the account the candidate must create
      ansible.builtin.user:
        name: auditor1
        state: absent
        remove: true

    - name: Clean slate — package hold, cron, units, ufw, hosts
      ansible.builtin.shell:
        cmd: |
          set +e
          apt-mark unhold tree 2>/dev/null
          apt-get remove -y -qq tree 2>/dev/null
          crontab -u devops -r 2>/dev/null
          systemctl disable --now labwatch.service labreport.timer 2>/dev/null
          # Tâche 2 — le service réparé par un run précédent redevient en panne :
          # les givens ci-dessus ont déjà réécrit l'unité et retiré le bit x,
          # il reste à l'arrêter pour qu'elle ne tourne pas au départ.
          systemctl disable --now collecteur.service 2>/dev/null
          # Tâche 10 — les ACL posées par un run précédent
          setfacl -bR /srv/rapports 2>/dev/null
          # Tâche 16 — l'automontage posé par un run précédent
          systemctl disable --now autofs 2>/dev/null
          umount -f /mnt/auto/donnees 2>/dev/null
          rm -f /etc/auto.master.d/lab.autofs /etc/auto.lab
          systemctl daemon-reload
          ufw --force reset 2>/dev/null
          ufw allow OpenSSH 2>/dev/null
          sed -i '/lab-target\.lab/d' /etc/hosts
          netplan apply 2>/dev/null
          exit 0
        chdir: /
      changed_when: false

    - name: Clean slate — Section E storage (unmount, fstab, swap, LVM, disk)
      ansible.builtin.shell:
        cmd: |
          set +e
          swapoff /swapfile 2>/dev/null
          rm -f /swapfile
          sed -i '\#^/swapfile#d' /etc/fstab
          umount /data /srv/quota /srv/data /mnt/auto/donnees 2>/dev/null
          sed -i '\#[[:space:]]/data[[:space:]]#d;\#[[:space:]]/srv/quota[[:space:]]#d;\#[[:space:]]/srv/data[[:space:]]#d' /etc/fstab
          lvremove -f /dev/vgdata 2>/dev/null
          vgremove -f vgdata 2>/dev/null
          pvremove -f -y /dev/vdb1 2>/dev/null
          wipefs -a /dev/vdb1 /dev/vdb2 /dev/vdb 2>/dev/null
          dd if=/dev/zero of=/dev/vdb bs=1M count=10 2>/dev/null
          partprobe /dev/vdb 2>/dev/null
          exit 0
        chdir: /
      changed_when: false

    - name: Create the mount points the candidate will use
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /data
        - /srv/quota

    - name: Brief the candidate
      ansible.builtin.debug:
        msg: >-
          Examen blanc LFCS : 17 tâches, 100 points, 120 minutes, 70/100 pour
          réussir, aucun indice. Le sujet est dans challenge/README.md
          (dsoxlab challenge lfcs-mock-exam). Tout doit être PERSISTANT au
          reboot. Ne touche jamais à l'interface de gestion — les tâches réseau sont sur lab0.
          /dev/vdb (5 Go) est vierge.
