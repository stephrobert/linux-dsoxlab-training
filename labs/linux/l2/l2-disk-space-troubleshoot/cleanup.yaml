---
# Reset idempotent : démonte /srv/data et efface le FS. Joué par dsoxlab clean.
- name: Cleanup disk-space-troubleshoot lab
  hosts: lab_target
  become: true
  gather_facts: false
  tasks:
    - name: Unmount /srv/data if mounted
      ansible.builtin.command: umount /srv/data
      changed_when: false
      failed_when: false

    - name: Wipe the filesystem on the target partition
      ansible.builtin.shell: |
        [ -f /root/dsk-disk.env ] || exit 0
        . /root/dsk-disk.env
        part="${DISK}1"; [ -b "$part" ] || part="${DISK}p1"
        wipefs -a "$part" 2>/dev/null || true
        wipefs -a "$DISK" 2>/dev/null || true
        partprobe "$DISK" 2>/dev/null || true
      changed_when: false

    - name: Remove the mount point and ready marker
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /srv/data
        - /root/.dsk-lab-ready
        # Lu plus haut pour connaître le disque : il doit partir avec
        # le reste, sinon le prochain setup saute la détection.
        - /root/dsk-disk.env
