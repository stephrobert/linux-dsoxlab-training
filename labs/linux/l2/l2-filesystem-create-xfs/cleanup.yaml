---
# Reset idempotent : démonte /srv/xfs et efface le FS de la partition.
# Joué par dsoxlab clean.
- name: Cleanup filesystem-create-xfs lab
  hosts: lab_target
  become: true
  gather_facts: false
  tasks:
    - name: Unmount /srv/xfs if mounted
      ansible.builtin.command: umount /srv/xfs
      changed_when: false
      failed_when: false

    - name: Wipe the filesystem on the target partition
      ansible.builtin.shell: |
        [ -f /root/xfs-disk.env ] || exit 0
        . /root/xfs-disk.env
        [ -n "$PART" ] && wipefs -a "$PART" 2>/dev/null || true
        wipefs -a "$DISK" 2>/dev/null || true
        partprobe "$DISK" 2>/dev/null || true
        rm -f /root/xfs-disk.env /root/.xfs-lab-ready
        exit 0
      changed_when: false

    - name: Remove the mount point
      ansible.builtin.file:
        path: /srv/xfs
        state: absent
