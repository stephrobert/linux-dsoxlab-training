id: ebpf-inventaire-bpftool
title: "Inventory the loaded eBPF programs with bpftool and stop the service that carries one"
description: "A service with a harmless name loads an eBPF program into the kernel. List the programs with bpftool, find which process and which systemd service carry the unknown one, name its type, then stop the service and keep it from coming back, without touching the programs systemd loads."
section: ebpf
lab_type: lab
level: l4
track:
  - securiser
skills:
  - ebpf
  - bpftool
  - systemd
  - inventory
  - incident-response
difficulty: intermediate
estimated_time: 25m
runtime:
  type: vm
  # On reste sur le poste : c'est à l'apprenant de taper son ssh vers
  # la machine du lab, et dsoxlab n'est installé que sur le poste.
  session: local
  default: rhel
  snapshot_required: false
  targets:
    - name: rhel
      host: alma-rhcsa-1.lab
      label_en: "AlmaLinux 10 (bpftool 7.7, bpftrace 0.24, kernel 6.12)"
      label_fr: "AlmaLinux 10 (bpftool 7.7, bpftrace 0.24, noyau 6.12)"
    - name: ubuntu
      host: ubuntu-lfcs-1.lab
      label_en: "Ubuntu 24.04 (bpftool 7.4, bpftrace 0.20, kernel 6.8)"
      label_fr: "Ubuntu 24.04 (bpftool 7.4, bpftrace 0.20, noyau 6.8)"
distros:
  - almalinux10
  - rhel10
  - ubuntu24.04
doc_url: https://blog.stephane-robert.info/docs/admin-serveurs/linux/ebpf/durcissement/surface-attaque-bpf/
validation:
  functional: true
  security: true
  persistence_after_reboot: true
