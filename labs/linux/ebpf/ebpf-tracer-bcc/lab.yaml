id: ebpf-tracer-bcc
title: "Unmask a mystery process with eBPF tracing tools"
description: "A hidden process writes to a hidden file every few seconds. Install the BCC (or bpftrace) tracing tools, observe the kernel's openat and execve calls, then name the program and the file, proven by comparing your answer with the host's ground truth."
section: ebpf
lab_type: lab
level: l4
track:
  - depanner
skills:
  - ebpf
  - bcc
  - bpftrace
  - opensnoop
  - execsnoop
  - tracing
difficulty: intermediate
estimated_time: 25m
runtime:
  type: vm
  # On reste sur le poste : c'est à l'apprenant de taper son ssh vers
  # la machine du lab, et dsoxlab n'est installé que sur le poste.
  session: local
  default: rhel
  snapshot_required: false
  targets:
    - name: rhel
      host: alma-rhcsa-1.lab
      label_en: "AlmaLinux 10 (bcc-tools, kernel 6.12)"
      label_fr: "AlmaLinux 10 (bcc-tools, noyau 6.12)"
    - name: ubuntu
      host: ubuntu-lfcs-1.lab
      label_en: "Ubuntu 24.04 (bpfcc-tools, kernel 6.8)"
      label_fr: "Ubuntu 24.04 (bpfcc-tools, noyau 6.8)"
distros:
  - almalinux10
  - rhel10
  - ubuntu24.04
doc_url: https://www.stephane-robert.info/docs/admin-serveurs/linux/ebpf/tracer/bpftrace/
validation:
  functional: true
  security: false
  persistence_after_reboot: false
